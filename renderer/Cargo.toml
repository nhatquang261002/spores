[package]
name = "spores-renderer"
version = "0.1.0"
description = "Fixed-point Physarum renderer for Spores: integer-only, byte-reproducible. Native, wasm32 and a JS port."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spores-render"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }
# CLI only (`state` reads the router's render_input JSON); the wasm build does not link it.
serde_json = "1"

[dev-dependencies]
spores-core = { path = "../core" }
