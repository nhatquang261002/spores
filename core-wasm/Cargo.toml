[package]
name = "spores-core-wasm"
version = "0.1.0"
description = "wasm32 C ABI over spores-core for the browser: epoch replay (fingerprints and tubes) and the per-spore state hash, with JSON in and out."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spores-core = { path = "../core" }
# JSON lives here only; spores-core stays dependency-light.
serde_json = "1"
