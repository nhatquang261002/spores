[package]
name = "spores-router"
version = "0.1.0"
description = "Spores router: NEP-171 spore NFTs, per-spore ledger, owner policy, job escrow and epoch close."
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
spores-core = { path = "../core" }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
spores-renderer = { path = "../renderer" }
